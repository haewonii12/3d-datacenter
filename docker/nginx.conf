server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types application/json application/javascript text/css text/csv image/svg+xml;
  gzip_min_length 1024;

  # Liveness/readiness probe target
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed bundles never change → cache for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Data file is replaced in place (volume mount) → always revalidate
  location /data/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Hash-based routing (#dc=…) needs no SPA fallback; index.html must not be cached stale
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location / {
    try_files $uri $uri/ =404;
  }
}
