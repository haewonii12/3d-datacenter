<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DC Rack 3D</title>
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <section id="map-view" hidden></section>
      <header id="topbar">
        <nav id="breadcrumb" aria-label="breadcrumb"></nav>
        <div id="search-wrap">
          <input id="search" type="search" placeholder="장비명 / 랙 / 회사 검색" autocomplete="off" spellcheck="false" />
          <ul id="search-results" hidden></ul>
        </div>
        <button id="theme-toggle" type="button"></button>
        <div id="warnings-wrap">
          <button id="warnings" type="button" hidden></button>
          <ul id="warnings-list" hidden></ul>
        </div>
      </header>
      <section id="floor-summary" hidden></section>
      <aside id="panel" hidden></aside>
      <div id="tooltip" hidden></div>
      <section id="error" hidden></section>
      <footer id="info"></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
